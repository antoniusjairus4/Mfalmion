[package]
name = "mfalmion-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
log = "0.4"
pgn-reader = "=0.29.0"
resvg = { version = "=0.50.0", default-features = false }
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shakmaty = "=0.30.1"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["x11", "wayland", "rwh_06"] }
